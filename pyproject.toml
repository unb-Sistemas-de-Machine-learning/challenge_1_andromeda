[project]
name = "challenge-1-andromeda"
version = "0.1.0"
description = "Auditable news analysis service with transparent criterion scoring."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "httpx>=0.27",
  "trafilatura>=1.9",
  "transformers>=4.40",
  "torch>=2.0",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "PyYAML>=6",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
