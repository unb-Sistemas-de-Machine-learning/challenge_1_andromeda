[project]
name = "challenge-1-andromeda"
version = "0.1.0"
description = "Auditable news analysis service with transparent criterion scoring."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "httpx>=0.27",
  "tldextract>=5.1",
  "lxml>=5",
  "trafilatura>=1.9",
  "transformers>=4.40,<5",
  "torch>=2.0",
  "numpy>=1.24",
  "onnxruntime>=1.18",
  "uvicorn>=0.29",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "PyYAML>=6",
]
mobile = [
  "onnx>=1.17",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
news_analysis = ["assets/bundles/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
