plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localEnv = rootProject.file('../.env')
def fromEnvFile = { key ->
    if (!localEnv.isFile()) return null
    def line = localEnv.readLines('UTF-8').find { it.startsWith(key + '=') }
    return line == null ? null : line.substring(key.length() + 1).trim().replaceAll(/^['"]|['"]$/, '')
}
def backendUrl = (System.getenv('FACTCHECK_BACKEND_URL') ?: fromEnvFile('FACTCHECK_BACKEND_URL') ?: 'https://challenge-1-andromeda-00o6.onrender.com').trim().replaceAll('/+$', '')
def proxyToken = (System.getenv('FACTCHECK_PROXY_TOKEN') ?: project.findProperty('factcheckProxyToken') ?: fromEnvFile('FACTCHECK_PROXY_TOKEN') ?: '').toString().trim()
if (!backendUrl.startsWith('https://')) throw new GradleException('FACTCHECK_BACKEND_URL precisa usar HTTPS.')
if (proxyToken.isEmpty()) throw new GradleException('Configure FACTCHECK_PROXY_TOKEN no ambiente, no ~/.gradle/gradle.properties ou no .env local.')

android {
    namespace 'br.unb.andromeda.antesdecompartilhar'
    compileSdk 36

    defaultConfig {
        applicationId 'br.unb.andromeda.antesdecompartilhar'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'FACTCHECK_BACKEND_URL', '"' + backendUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'FACTCHECK_PROXY_TOKEN', '"' + proxyToken.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
