openapi: 3.1.0
info:
  title: News Analysis API
  version: 0.1.0
  description: 'Contract for analyzing a news URL and returning an operational reliability
    index with traceable criterion evidence. Scores are not probabilities of truth
    or falsity.

    '
paths:
  /analyses:
    post:
      summary: Analyze one news URL
      operationId: createAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: Analysis completed or completed with unavailable criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '400':
          description: Invalid URL or unsupported URL scheme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: URL blocked for security
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: External fetch, fact-checking, or model execution failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analyses/{analysis_id}:
    get:
      summary: Retrieve an audit record by analysis id
      operationId: getAnalysis
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stored audit record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        '404':
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Analysis: &id001
      properties:
        id:
          type: string
          title: Id
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        input:
          additionalProperties:
            type: string
          type: object
          title: Input
        article:
          anyOf:
          - $ref: '#/components/schemas/Article'
          - type: 'null'
        criteria:
          $ref: '#/components/schemas/CriteriaSet'
        final:
          $ref: '#/components/schemas/FinalScore'
        pipeline_version:
          $ref: '#/components/schemas/PipelineVersion'
        limitations:
          items:
            type: string
          type: array
          title: Limitations
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      additionalProperties: false
      type: object
      required:
      - id
      - status
      - input
      - criteria
      - final
      - pipeline_version
      - limitations
      title: Analysis
    AnalysisRequest:
      properties:
        url:
          type: string
          title: Url
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        claim:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 3
          - type: 'null'
          title: Claim
      additionalProperties: false
      type: object
      required:
      - url
      title: AnalysisRequest
    AnalysisStatus:
      type: string
      enum:
      - SUCCESS
      - INVALID_URL
      - BLOCKED_INTERNAL_URL
      - NEWS_FETCH_FAILED
      - ARTICLE_EXTRACTION_FAILED
      - FACT_CHECK_API_ERROR
      - WRITING_MODEL_ERROR
      - CRITERION_UNAVAILABLE
      - RATE_LIMITED
      title: AnalysisStatus
    Article:
      properties:
        original_url:
          type: string
          title: Original Url
        final_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Final Url
        canonical_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Url
        publisher:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        subtitle:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtitle
        author:
          anyOf:
          - type: string
          - type: 'null'
          title: Author
        published_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Published At
        content_hash:
          type: string
          title: Content Hash
        extracted_character_count:
          type: integer
          minimum: 0.0
          title: Extracted Character Count
      additionalProperties: false
      type: object
      required:
      - original_url
      - content_hash
      - extracted_character_count
      title: Article
    CriteriaSet:
      properties:
        verifiable_facts:
          $ref: '#/components/schemas/FactCheckCriterionResult'
        writing_style:
          $ref: '#/components/schemas/WritingStyleCriterionResult'
        credibility:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Credibility
        credibility_evidence:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Credibility Evidence
      additionalProperties: false
      type: object
      required:
      - verifiable_facts
      - writing_style
      title: CriteriaSet
    CriterionStatus:
      type: string
      enum:
      - EXECUTED
      - UNAVAILABLE
      - ERROR
      title: CriterionStatus
    ErrorInfo:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - retryable
      title: ErrorInfo
    FactCheckCriterionResult:
      properties:
        available:
          type: boolean
          title: Available
        status:
          $ref: '#/components/schemas/CriterionStatus'
        score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Score
        name:
          type: string
          title: Name
          default: Checagem de fatos verificáveis
        method:
          type: string
          title: Method
          default: google_fact_check_claim_reviews
        target_claim:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Claim
        claim_origin:
          type: string
          title: Claim Origin
          default: article_title_or_excerpt
        scope:
          type: string
          title: Scope
          default: Uma afirmação selecionada; não verifica todos os fatos da notícia
            nem a reputação da fonte.
        formula:
          type: string
          title: Formula
          default: F = mean(publisher means of unique applicable mapped reviews)
        limitation:
          type: string
          title: Limitation
          default: Google retrieves published reviews; matching is lexical, the score
            is project-defined, and absence of a review is not a verdict.
        scored_reviews_count:
          type: integer
          title: Scored Reviews Count
          default: 0
        publishers_count:
          type: integer
          title: Publishers Count
          default: 0
        publisher_scores:
          additionalProperties:
            type: number
          type: object
          title: Publisher Scores
        conflicting_verdicts:
          type: boolean
          title: Conflicting Verdicts
          default: false
        search_attempts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Search Attempts
        search_truncated:
          type: boolean
          title: Search Truncated
          default: false
        query:
          type: string
          title: Query
          default: ''
        reviews_count:
          type: integer
          minimum: 0.0
          title: Reviews Count
        applicable_reviews_count:
          type: integer
          minimum: 0.0
          title: Applicable Reviews Count
        reviews:
          items:
            $ref: '#/components/schemas/FactCheckReview'
          type: array
          title: Reviews
        intended_weight:
          type: number
          title: Intended Weight
          default: 0.6
        effective_weight:
          anyOf:
          - type: number
          - type: 'null'
          title: Effective Weight
        contribution:
          anyOf:
          - type: number
          - type: 'null'
          title: Contribution
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - available
      - status
      - reviews_count
      - applicable_reviews_count
      - reviews
      title: FactCheckCriterionResult
    FactCheckReview:
      properties:
        claim:
          anyOf:
          - type: string
          - type: 'null'
          title: Claim
        publisher_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher Name
        publisher_site:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher Site
        review_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Review Url
        review_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Review Title
        review_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Review Date
        textual_rating:
          anyOf:
          - type: string
          - type: 'null'
          title: Textual Rating
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        claimant:
          anyOf:
          - type: string
          - type: 'null'
          title: Claimant
        claim_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Claim Date
        applicable:
          type: boolean
          title: Applicable
        included_in_score:
          type: boolean
          title: Included In Score
          default: false
        exclusion_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Exclusion Reason
        publisher_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher Key
        normalized_value:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Normalized Value
        raw:
          additionalProperties: true
          type: object
          title: Raw
      additionalProperties: false
      type: object
      required:
      - applicable
      - raw
      title: FactCheckReview
    FinalScore:
      properties:
        score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Score
        coverage:
          type: number
          title: Coverage
        intended_weights:
          additionalProperties:
            type: number
          type: object
          title: Intended Weights
        effective_weights:
          additionalProperties:
            type: number
          type: object
          title: Effective Weights
        formula:
          type: string
          title: Formula
        limitation:
          type: string
          title: Limitation
      additionalProperties: false
      type: object
      required:
      - coverage
      - intended_weights
      - effective_weights
      - formula
      - limitation
      title: FinalScore
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PipelineVersion:
      properties:
        id:
          type: string
          title: Id
        rules_version:
          type: string
          title: Rules Version
        fact_check_mapping_version:
          type: string
          title: Fact Check Mapping Version
        writing_model_name:
          type: string
          title: Writing Model Name
        writing_model_revision:
          anyOf:
          - type: string
          - type: 'null'
          title: Writing Model Revision
        dependency_versions:
          additionalProperties:
            type: string
          type: object
          title: Dependency Versions
      additionalProperties: false
      type: object
      required:
      - id
      - rules_version
      - fact_check_mapping_version
      - writing_model_name
      - dependency_versions
      title: PipelineVersion
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WritingPrediction:
      properties:
        label:
          type: string
          title: Label
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        writing_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Writing Score
      additionalProperties: false
      type: object
      required:
      - label
      - confidence
      - writing_score
      title: WritingPrediction
    WritingSegmentResult:
      properties:
        index:
          type: integer
          minimum: 0.0
          title: Index
        character_count:
          type: integer
          minimum: 1.0
          title: Character Count
        token_count:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Token Count
        label:
          type: string
          title: Label
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        writing_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Writing Score
      additionalProperties: false
      type: object
      required:
      - index
      - character_count
      - label
      - confidence
      - writing_score
      title: WritingSegmentResult
    WritingStyleCriterionResult:
      properties:
        available:
          type: boolean
          title: Available
        status:
          $ref: '#/components/schemas/CriterionStatus'
        score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Score
        model:
          type: string
          title: Model
          default: vzani/portuguese-fake-news-classifier-bertimbau-combined
        model_version:
          type: string
          title: Model Version
        prediction:
          anyOf:
          - $ref: '#/components/schemas/WritingPrediction'
          - type: 'null'
        segments_analyzed:
          type: integer
          minimum: 0.0
          title: Segments Analyzed
        segments:
          items:
            $ref: '#/components/schemas/WritingSegmentResult'
          type: array
          title: Segments
        qualitative_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Qualitative State
        limitation:
          type: string
          title: Limitation
        intended_weight:
          type: number
          title: Intended Weight
          default: 0.4
        effective_weight:
          anyOf:
          - type: number
          - type: 'null'
          title: Effective Weight
        contribution:
          anyOf:
          - type: number
          - type: 'null'
          title: Contribution
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - available
      - status
      - model_version
      - segments_analyzed
      - segments
      - limitation
      title: WritingStyleCriterionResult
    AnalysisResponse: *id001
    ErrorResponse:
      type: object
      required:
      - status
      - error
      properties:
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        error:
          $ref: '#/components/schemas/ErrorInfo'
      additionalProperties: false
