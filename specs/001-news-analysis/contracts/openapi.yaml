openapi: 3.1.0
info:
  title: News Analysis API
  version: 0.1.0
  description: >
    Contract for analyzing a news URL and returning an operational reliability
    index with traceable criterion evidence. Scores are not probabilities of
    truth or falsity.
paths:
  /analyses:
    post:
      summary: Analyze one news URL
      operationId: createAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: Analysis completed or completed with unavailable criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "400":
          description: Invalid URL or unsupported URL scheme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: URL blocked for security
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: External fetch, fact-checking, or model execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyses/{analysis_id}:
    get:
      summary: Retrieve an audit record by analysis id
      operationId: getAnalysis
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored audit record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
        "404":
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AnalysisRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: HTTP or HTTPS news URL to analyze.
        user_id:
          type: string
          description: Stable user identifier used for rate limiting.
      additionalProperties: false
    AnalysisResponse:
      type: object
      required:
        - id
        - status
        - input
        - criteria
        - final
        - pipeline_version
        - limitations
        - created_at
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        input:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
          additionalProperties: false
        article:
          $ref: "#/components/schemas/Article"
        criteria:
          $ref: "#/components/schemas/Criteria"
        final:
          $ref: "#/components/schemas/FinalScore"
        pipeline_version:
          $ref: "#/components/schemas/PipelineVersion"
        limitations:
          type: array
          items:
            type: string
        error:
          $ref: "#/components/schemas/ErrorInfo"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      additionalProperties: false
    AnalysisStatus:
      type: string
      enum:
        - SUCCESS
        - INVALID_URL
        - BLOCKED_INTERNAL_URL
        - NEWS_FETCH_FAILED
        - ARTICLE_EXTRACTION_FAILED
        - FACT_CHECK_API_ERROR
        - WRITING_MODEL_ERROR
        - CRITERION_UNAVAILABLE
        - RATE_LIMITED
    Article:
      type: object
      required:
        - original_url
        - content_hash
        - extracted_character_count
      properties:
        original_url:
          type: string
          format: uri
        final_url:
          type: string
          format: uri
        canonical_url:
          type: string
          format: uri
        publisher:
          type: string
        title:
          type: string
        subtitle:
          type: string
        author:
          type: string
        published_at:
          type: string
        content_hash:
          type: string
        extracted_character_count:
          type: integer
          minimum: 1000
      additionalProperties: false
    Criteria:
      type: object
      required:
        - source_credibility
        - writing_style
        - factual_claims
      properties:
        source_credibility:
          $ref: "#/components/schemas/FactCheckCriterion"
        writing_style:
          $ref: "#/components/schemas/WritingStyleCriterion"
        factual_claims:
          $ref: "#/components/schemas/ReservedCriterion"
      additionalProperties: false
    FactCheckCriterion:
      type: object
      required:
        - available
        - status
        - score
        - method
        - query
        - reviews_count
        - applicable_reviews_count
        - reviews
        - intended_weight
      properties:
        available:
          type: boolean
        status:
          type: string
          enum: [EXECUTED, UNAVAILABLE, ERROR]
        score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        method:
          type: string
          const: google_fact_check_rating
        query:
          type: string
        reviews_count:
          type: integer
          minimum: 0
        applicable_reviews_count:
          type: integer
          minimum: 0
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/FactCheckReview"
        intended_weight:
          type: number
          const: 0.6
        effective_weight:
          type:
            - number
            - "null"
        contribution:
          type:
            - number
            - "null"
        error:
          $ref: "#/components/schemas/ErrorInfo"
      additionalProperties: false
    FactCheckReview:
      type: object
      required:
        - applicable
        - normalized_value
        - raw
      properties:
        claim:
          type: string
        publisher_name:
          type: string
        publisher_site:
          type: string
        review_url:
          type: string
          format: uri
        review_title:
          type: string
        review_date:
          type: string
        textual_rating:
          type: string
        language:
          type: string
        applicable:
          type: boolean
        normalized_value:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        raw:
          type: object
      additionalProperties: false
    WritingStyleCriterion:
      type: object
      required:
        - available
        - status
        - score
        - model
        - model_version
        - segments_analyzed
        - segments
        - qualitative_state
        - limitation
        - intended_weight
      properties:
        available:
          type: boolean
        status:
          type: string
          enum: [EXECUTED, UNAVAILABLE, ERROR]
        score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        model:
          type: string
          const: vzani/portuguese-fake-news-classifier-bertimbau-combined
        model_version:
          type: string
        prediction:
          $ref: "#/components/schemas/WritingPrediction"
        segments_analyzed:
          type: integer
          minimum: 0
        segments:
          type: array
          items:
            $ref: "#/components/schemas/WritingSegment"
        qualitative_state:
          type:
            - string
            - "null"
          enum:
            - Sinal de escrita suspeito
            - null
        limitation:
          type: string
        intended_weight:
          type: number
          const: 0.4
        effective_weight:
          type:
            - number
            - "null"
        contribution:
          type:
            - number
            - "null"
        error:
          $ref: "#/components/schemas/ErrorInfo"
      additionalProperties: false
    WritingPrediction:
      type: object
      required:
        - label
        - confidence
        - writing_score
      properties:
        label:
          type: string
          enum: [Fake, True]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        writing_score:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
    WritingSegment:
      type: object
      required:
        - index
        - character_count
        - label
        - confidence
        - writing_score
      properties:
        index:
          type: integer
          minimum: 0
        character_count:
          type: integer
          minimum: 1
        token_count:
          type: integer
          minimum: 1
        label:
          type: string
          enum: [Fake, True]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        writing_score:
          type: number
          minimum: 0
          maximum: 1
      additionalProperties: false
    ReservedCriterion:
      type: object
      required:
        - available
        - score
        - status
        - planned_model
        - planned_flow
      properties:
        available:
          type: boolean
          const: false
        score:
          type: "null"
        status:
          type: string
          const: NOT_IMPLEMENTED
        planned_model:
          type: string
          const: Ashg2099/xlm-roberta-factchecker
        planned_flow:
          type: array
          items:
            type: string
      additionalProperties: false
    FinalScore:
      type: object
      required:
        - score
        - coverage
        - intended_weights
        - effective_weights
        - formula
        - limitation
      properties:
        score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
        coverage:
          type: number
          enum: [0, 40, 60, 100]
        intended_weights:
          type: object
          required: [source_credibility, writing_style]
          properties:
            source_credibility:
              type: number
              const: 0.6
            writing_style:
              type: number
              const: 0.4
          additionalProperties: false
        effective_weights:
          type: object
          additionalProperties:
            type: number
        formula:
          type: string
        limitation:
          type: string
      additionalProperties: false
    PipelineVersion:
      type: object
      required:
        - id
        - rules_version
        - fact_check_mapping_version
        - writing_model_name
        - dependency_versions
      properties:
        id:
          type: string
        rules_version:
          type: string
        fact_check_mapping_version:
          type: string
        writing_model_name:
          type: string
        writing_model_revision:
          type: string
        dependency_versions:
          type: object
      additionalProperties: false
    ErrorInfo:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - status
        - error
      properties:
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        error:
          $ref: "#/components/schemas/ErrorInfo"
      additionalProperties: false
